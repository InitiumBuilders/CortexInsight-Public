# The foreign machine, every push. A Windows runner nobody here has touched
# runs the gate, the stranger's first hour, and the packager. On a version tag
# the zip becomes a Release anyone can download and run.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    name: open-source gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: parse
        run: |
          node --check main.js
          node --check preload.js
          node --check src/renderer.js
          node --check src/renderer-v2.js
      - name: gate
        run: node scripts/oss-check.js

  windows:
    name: fresh run and package (windows)
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: dependencies
        run: npm ci --no-audit --no-fund
      - name: the stranger's first hour
        shell: pwsh
        run: |
          Remove-Item "$env:TEMP\ci-fresh-report.txt" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "node_modules\electron\dist\electron.exe" -ArgumentList ". --freshtest" -PassThru -Wait
          "electron exit code: $($p.ExitCode)"
          if (-not (Test-Path "$env:TEMP\ci-fresh-report.txt")) { throw "the fresh harness wrote no report" }
          Get-Content "$env:TEMP\ci-fresh-report.txt"
          New-Item -ItemType Directory -Force fresh-artifacts | Out-Null
          Copy-Item "$env:TEMP\ci-fresh-report.txt" fresh-artifacts\
          Copy-Item "$env:TEMP\fresh-*.png" fresh-artifacts\ -ErrorAction SilentlyContinue
          if (Select-String -Path "$env:TEMP\ci-fresh-report.txt" -Pattern 'PROBLEM' -Quiet) { throw "the fresh harness found problems" }
          if (-not (Select-String -Path "$env:TEMP\ci-fresh-report.txt" -Pattern 'CLEAN' -Quiet)) { throw "the fresh harness did not reach its verdict" }
      - name: the stranger's fleet
        shell: pwsh
        run: |
          Remove-Item "$env:TEMP\ci-fleet-report.txt" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "node_modules\electron\dist\electron.exe" -ArgumentList ". --fleettest" -PassThru -Wait
          "electron exit code: $($p.ExitCode)"
          if (-not (Test-Path "$env:TEMP\ci-fleet-report.txt")) { throw "the fleet harness wrote no report" }
          Get-Content "$env:TEMP\ci-fleet-report.txt"
          New-Item -ItemType Directory -Force fresh-artifacts | Out-Null
          Copy-Item "$env:TEMP\ci-fleet-report.txt" fresh-artifacts\
          Copy-Item "$env:TEMP\fleet-*.png" fresh-artifacts\ -ErrorAction SilentlyContinue
          if (Select-String -Path "$env:TEMP\ci-fleet-report.txt" -Pattern 'PROBLEM' -Quiet) { throw "the fleet harness found problems" }
          if (-not (Select-String -Path "$env:TEMP\ci-fleet-report.txt" -Pattern 'CLEAN' -Quiet)) { throw "the fleet harness did not reach its verdict" }
      - name: keep the first hour's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-run
          path: fresh-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: package
        run: npm run package
      - name: zip
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "CortexInsight-$ver-win-x64.zip"
          Compress-Archive -Path "release-next\CortexInsight-win32-x64\*" -DestinationPath $zip -CompressionLevel Optimal
          "zip: $zip  $([math]::Round((Get-Item $zip).Length / 1MB)) MB"
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: keep the build
        uses: actions/upload-artifact@v4
        with:
          name: CortexInsight-win-x64
          path: ${{ env.ZIP }}
          retention-days: 14
      - name: release on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
          body: |
            **Windows:** unzip anywhere, run `CortexInsight.exe`. SmartScreen may warn once (the build is not code-signed): More info → Run anyway.
            **macOS:** unzip, move `CortexInsight.app` where you like, then right-click → Open the first time (unsigned), or `xattr -dr com.apple.quarantine CortexInsight.app`. Apple silicon takes the arm64 zip, Intel the x64 zip.
            The gate asks you to set a passphrase on first run. Your vault lives in your user data folder, never inside the app.
            `docs/INSTALL.md` covers the fleet tree, the relay, and what works on each platform.

  macos:
    name: fresh run and package (macos)
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: dependencies
        run: npm ci --no-audit --no-fund
      - name: the stranger's first hour
        run: |
          set -uo pipefail
          T="${TMPDIR:-/tmp}"
          echo "TMPDIR=$T"
          rm -f "$T/ci-fresh-report.txt"
          npx electron . --freshtest || echo "electron exit: $?"
          R=$(find "$T" /tmp "$HOME/Library/Application Support" -maxdepth 2 -name ci-fresh-report.txt 2>/dev/null | head -1)
          if [ -z "$R" ]; then echo "the fresh harness wrote no report"; ls -la "$T" | head -30; exit 1; fi
          cat "$R"
          mkdir -p fresh-artifacts
          cp "$R" fresh-artifacts/
          cp "$(dirname "$R")"/fresh-*.png fresh-artifacts/ 2>/dev/null || true
          if grep -q PROBLEM "$R"; then echo "the fresh harness found problems"; exit 1; fi
          if ! grep -q CLEAN "$R"; then echo "the fresh harness did not reach its verdict"; exit 1; fi
      - name: the stranger's fleet
        run: |
          set -uo pipefail
          T="${TMPDIR:-/tmp}"
          rm -f "$T/ci-fleet-report.txt"
          npx electron . --fleettest || echo "electron exit: $?"
          R=$(find "$T" /tmp "$HOME/Library/Application Support" -maxdepth 2 -name ci-fleet-report.txt 2>/dev/null | head -1)
          if [ -z "$R" ]; then echo "the fleet harness wrote no report"; exit 1; fi
          cat "$R"
          mkdir -p fresh-artifacts
          cp "$R" fresh-artifacts/
          cp "$(dirname "$R")"/fleet-*.png fresh-artifacts/ 2>/dev/null || true
          if grep -q PROBLEM "$R"; then echo "the fleet harness found problems"; exit 1; fi
          if ! grep -q CLEAN "$R"; then echo "the fleet harness did not reach its verdict"; exit 1; fi
      - name: keep the first hour's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-run-macos
          path: fresh-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: package (apple silicon and intel)
        run: |
          npm run package:mac
          npm run package:mac-x64
      - name: zip
        run: |
          VER=$(node -p "require('./package.json').version")
          ditto -c -k --sequesterRsrc --keepParent release-next/CortexInsight-darwin-arm64/CortexInsight.app "CortexInsight-$VER-mac-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent release-next/CortexInsight-darwin-x64/CortexInsight.app "CortexInsight-$VER-mac-x64.zip"
          ls -la CortexInsight-*.zip
      - name: keep the builds
        uses: actions/upload-artifact@v4
        with:
          name: CortexInsight-mac
          path: CortexInsight-*-mac-*.zip
          retention-days: 14
      - name: release on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CortexInsight-*-mac-*.zip
