<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'none'; connect-src 'none';" />
<title>Motus Max</title>
<style>
  /* ==========================================================================
     THE MOTUS MAX HUD
     Laid over the whole screen while an agent is driving. Everything here is
     either transparent or a thin glowing line — August has to be able to WORK
     underneath it. If it ever obscures his screen it has failed at its job.

     Performance law (learned the hard way on this app): no backdrop-filter,
     no animated blur, no filter: on a full-screen element. One canvas, 30fps,
     and it idles to nothing when she is not moving.
     ========================================================================== */
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:transparent;
    font-family:'Sora','Segoe UI',system-ui,sans-serif; -webkit-user-select:none; user-select:none; cursor:default; }

  /* THE STAGE. This window spans EVERY monitor, so nothing here is positioned
     against the window — it is positioned against #stage, which is set from
     main to the rect of the screen August is actually on. Move to the other
     monitor and the stage moves; the window never has to. That is why the HUD
     can no longer end up sized for one screen and drawn on another. */
  /* --k is set from the stage width: everything in the HUD scales with the
     display it is drawn on, so it reads identically on a 1280 laptop panel and
     a 2560 monitor, and re-scales the moment he moves between them. */
  #stage{ --k:1; position:fixed; left:0; top:0; width:100%; height:100%;
    transition:left .22s cubic-bezier(.16,1,.3,1), top .22s cubic-bezier(.16,1,.3,1),
               width .22s cubic-bezier(.16,1,.3,1), height .22s cubic-bezier(.16,1,.3,1); }
  /* jumping between monitors should SNAP, not glide across the desk */
  #stage.snap{ transition:none; }
  #sky{ position:fixed; inset:0; display:block; }

  /* the aura — a rim of light around the screen edge, coloured by what she is
     doing. A border, not a fill, so nothing underneath is tinted or dimmed. */
  /* SPEED. These fades were .7–1.2s, which made arming feel laggy even once the
     window itself was instant — the state was already true, it just had not
     finished appearing. Everything that signals "it is on" now lands in ~180ms.
     Only the ambient breathing loops stay slow, because those are texture. */
  #aura{ position:absolute; inset:0; pointer-events:none; opacity:0;
    transition:opacity .18s cubic-bezier(.16,1,.3,1), box-shadow .45s cubic-bezier(.16,1,.3,1);
    box-shadow: inset 0 0 120px 6px var(--glow), inset 0 0 22px 1px var(--edge);
    --glow:rgba(169,120,255,.20); --edge:rgba(169,120,255,.34); }
  body.live #aura{ opacity:1; }
  body.acting  #aura{ --glow:rgba(84,230,255,.24); --edge:rgba(84,230,255,.42); }
  body.waiting #aura{ --glow:rgba(255,206,107,.26); --edge:rgba(255,206,107,.46); }
  body.blocked #aura{ --glow:rgba(255,93,120,.30); --edge:rgba(255,93,120,.52); }
  /* ARMED · STANDBY — the golden hold. Quieter than driving on purpose: this is
     potential, not motion. But it is unmistakably ON, so arming never again
     looks like nothing happened. */
  body.standby #aura{ --glow:rgba(255,206,107,.16); --edge:rgba(255,213,107,.34); opacity:1; }
  body.standby .br{ opacity:.62; animation-duration:6s; }

  /* corner brackets — the "something is watching" signature, four of them,
     breathing slowly. Pure CSS borders: free to animate. */
  .br{ position:absolute; width:calc(54px * var(--k,1)); height:calc(54px * var(--k,1)); pointer-events:none; opacity:0;
    border:2px solid var(--edge, rgba(169,120,255,.5));
    transition:opacity .16s cubic-bezier(.16,1,.3,1); animation:breathe 4.2s cubic-bezier(.45,0,.15,1) infinite; }
  body.live .br{ opacity:.85; }
  .br.tl{ top:14px; left:14px;  border-right:none; border-bottom:none; border-radius:14px 0 0 0; }
  .br.tr{ top:14px; right:14px; border-left:none;  border-bottom:none; border-radius:0 14px 0 0; }
  .br.bl{ bottom:14px; left:14px;  border-right:none; border-top:none; border-radius:0 0 0 14px; }
  .br.br2{ bottom:14px; right:14px; border-left:none;  border-top:none; border-radius:0 0 14px 0; }
  @keyframes breathe{ 0%,100%{ opacity:.5; transform:scale(1); } 50%{ opacity:.95; transform:scale(1.035); } }

  /* the telemetry chip — bottom centre, small, always truthful */
  #chip{ position:absolute; left:50%; bottom:calc(26px * var(--k,1)); transform:translateX(-50%) translateY(14px);
    display:flex; align-items:center; gap:calc(14px * var(--k,1));
    padding:calc(11px * var(--k,1)) calc(20px * var(--k,1)) calc(11px * var(--k,1)) calc(16px * var(--k,1));
    border-radius:calc(22px * var(--k,1)); font-size:calc(1rem * var(--k,1));
    background:linear-gradient(150deg, rgba(16,20,42,.93), rgba(8,10,24,.95));
    border:1px solid rgba(150,168,255,.22); box-shadow:0 18px 60px rgba(0,0,0,.66), 0 0 44px rgba(169,120,255,.2);
    opacity:0; transition:opacity .2s cubic-bezier(.16,1,.3,1), transform .22s cubic-bezier(.16,1,.3,1);
    max-width:min(78vw, 900px); }
  body.live #chip{ opacity:1; transform:translateX(-50%) translateY(0); }

  #orb{ position:relative; width:15px; height:15px; flex:0 0 15px; border-radius:50%;
    background:var(--dot,#a978ff); box-shadow:0 0 16px var(--dot,#a978ff); }
  #orb::after{ content:''; position:absolute; inset:-7px; border-radius:50%;
    border:1.5px solid var(--dot,#a978ff); opacity:.5; animation:pulse 2.1s cubic-bezier(.45,0,.15,1) infinite; }
  @keyframes pulse{ 0%{ transform:scale(.72); opacity:.75; } 100%{ transform:scale(1.5); opacity:0; } }
  body.acting  #orb{ --dot:#54e6ff; }
  body.waiting #orb{ --dot:#ffce6b; }
  body.blocked #orb{ --dot:#ff5d78; }
  body.standby #orb{ --dot:#ffd56b; }
  body.standby #orb::after{ animation-duration:3.2s; }
  /* LISTENING — Ctrl+Shift+M. Unmistakable, because speaking into a mic that
     is not on is a special kind of frustrating. */
  body.listening #orb{ --dot:#54ffa8; }
  body.listening #orb::after{ animation-duration:.9s; }
  body.listening #mode{ color:#54ffa8; text-shadow:0 0 18px rgba(84,255,168,.7); }
  body.listening #chip{ border-color:rgba(84,255,168,.42); box-shadow:0 18px 60px rgba(0,0,0,.66), 0 0 52px rgba(84,255,168,.3); }
  body.listening #aura{ --glow:rgba(84,255,168,.20); --edge:rgba(84,255,168,.40); opacity:1; }

  .col{ min-width:0; }
  #mode{ font-size:10px; font-weight:800; letter-spacing:.20em; color:#a978ff; text-transform:uppercase;
    text-shadow:0 0 14px rgba(169,120,255,.6); white-space:nowrap; }
  body.acting  #mode{ color:#54e6ff; text-shadow:0 0 14px rgba(84,230,255,.6); }
  body.waiting #mode{ color:#ffce6b; text-shadow:0 0 14px rgba(255,206,107,.6); }
  body.blocked #mode{ color:#ff5d78; text-shadow:0 0 14px rgba(255,93,120,.6); }
  body.standby #mode{ color:#ffd56b; text-shadow:0 0 16px rgba(255,213,107,.7); }
  body.standby #chip{ border-color:rgba(255,213,107,.34); box-shadow:0 18px 60px rgba(0,0,0,.66), 0 0 44px rgba(255,206,107,.22); }
  #what{ font-size:12.5px; color:#eef1ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52vw; }
  /* A QUESTION IS NEVER TRUNCATED. Everything else is a status line and may
     ellipsis; this one is the thing he has to answer, so it wraps and the chip
     grows to fit it. A clipped question is a stalled session. */
  body.asking #what{ white-space:normal; overflow:visible; max-width:min(60vw,760px); line-height:1.45; font-size:13.5px; }
  body.asking #chip{ align-items:flex-start; padding-top:14px; padding-bottom:14px; }
  body.asking #orb{ margin-top:3px; }
  #ask-hint{ font-size:10.5px; letter-spacing:.06em; color:#ffd56b; margin-top:5px; }
  #ask-hint:empty{ display:none; }
  #meta{ font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; color:#54e6ff; white-space:nowrap; }
  #fuse{ font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; color:#ffce6b; white-space:nowrap; }
  .sep{ width:1px; height:22px; background:rgba(150,168,255,.2); flex:0 0 1px; }
  #kill{ font-size:9.5px; letter-spacing:.1em; color:#8892c4; white-space:nowrap; text-transform:uppercase; }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <!-- everything visual lives inside the stage = the screen he is on -->
  <div id="stage">
  <div id="aura"></div>
  <div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br br2"></div>

  <div id="chip">
    <div id="orb"></div>
    <div class="col">
      <div id="mode">MOTUS MAX</div>
      <div id="what">reading the system…</div>
      <div id="ask-hint"></div>
    </div>
    <div class="sep"></div>
    <div id="meta">—</div>
    <div class="sep"></div>
    <div id="fuse">—</div>
    <div class="sep"></div>
    <div id="kill">Ctrl+Alt+Shift+X to stop</div>
  </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
